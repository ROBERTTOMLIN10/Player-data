# Temporary: classic box score structure. Removed before merge.
name: Probe2
on:
  push:
    branches: [claude/friendly-dijkstra-s2fxp1]
    paths: [tools/probe/box.mts, .github/workflows/probe2.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx tsx tools/probe/box.mts

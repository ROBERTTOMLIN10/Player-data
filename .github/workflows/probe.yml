# Temporary: other sources for the last three teams. Removed before merge.
name: Probe
on:
  push:
    branches: [claude/friendly-dijkstra-s2fxp1]
    paths: [tools/probe/**, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx tsx tools/probe/probe.mts 2>&1 | tee probe-out.log
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p probe-out && cp probe-out.log probe-out/probe.log && cd probe-out && git init -q -b probe-data && git add . \
            && git -c user.name=bot -c user.email=bot@example.com commit -qm samples \
            && git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-data
